name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and verify package
        shell: bash
        run: |
          python -m pip install --upgrade pip build pytest mujoco numpy
          python -m build
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python - <<'PY'
          import email, os, pathlib, zipfile
          wheel, = pathlib.Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              metadata, = (n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              pkg_ver = email.message_from_bytes(archive.read(metadata))["Version"]
          expected_tag = f"v{pkg_ver}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Tag {actual_tag!r} does not match wheel version {pkg_ver!r} (expected {expected_tag!r})")
          PY
          fi
          python -m pip install --force-reinstall --no-deps dist/*.whl
          pytest -v tests
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi == true
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment: testpypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi != true)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
